# Dependabot keeps the advisory fixes arriving as pull requests instead of
# accumulating as unread alerts. Grouping is by the packages that have to move
# together: bumping `next` on its own leaves `eslint-config-next` behind and
# the lint step then resolves against a different Next.js than the build.
version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      next:
        patterns:
          - next
          - eslint-config-next
          - '@next/*'
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      drizzle:
        patterns:
          - drizzle-orm
          - drizzle-kit
      i18n:
        patterns:
          - i18next
          - react-i18next
      # Unlike the groups above, this one is a bucket of unrelated tools that
      # do not have to move together, so it takes minor and patch only. A
      # grouped major here traps the safe updates behind the one that cannot
      # merge: the first run bundled eslint 9 to 10, typescript 5 to 7 and
      # vitest 4 to 5, and the whole pull request failed lint on the
      # typescript bump alone. Majors now arrive one per pull request.
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Node 24 is pinned by .nvmrc and by engines in package.json, so the
      # types package must not run ahead of the runtime CI installs.
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      # eslint-config-next bundles typescript-eslint, which refuses to load
      # against TypeScript 7 and fails `npm run lint` outright. Drop this
      # entry once typescript-eslint ships TS >= 7.1 support, tracked at
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      # ESLint 10 is blocked by eslint-config-next too, and one layer deeper.
      # The eslint-plugin-react it bundles still calls the ESLint 9 context
      # API that 10 removed, so every rule load throws
      # `contextOrFilename.getFilename is not a function`. Nothing in this
      # repository can fix that; it needs a new eslint-config-next. Drop this
      # entry when one ships that supports ESLint 10, and revisit the
      # brace-expansion override below at the same time: ESLint 10 pulls
      # minimatch 10, which needs brace-expansion 5 and its named `expand`
      # export, so the 1.1.18 pin has to move with it.
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'

  # actions/checkout and actions/setup-node in .github/workflows/test.yml
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
