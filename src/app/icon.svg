<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="feedmyfrog">
  <title>feedmyfrog</title>
  <!--
    The grumpy frog from the feedmyfrog logo, redrawn as geometry rather than
    traced from public/feedmyfrog.jpg. A trace of a 1536px image produces
    thousands of path nodes that turn to mud at the 16x16 a browser tab
    actually renders; these few shapes stay legible all the way down.

    Read at 16px it is: green pad, dark frog, two white eyes. The lids and
    the frown only have to survive from 32px up. Nothing smaller than that is
    in here, because at tab size it would only turn the shape to mud.

    The green is #8DC63F, the same accent the buttons and the avatar use, so
    the tab matches the app rather than merely resembling the logo.
  -->
  <circle cx="32" cy="32" r="32" fill="#8DC63F"/>

  <!-- Body, then the two eye bumps sitting on top of it. -->
  <ellipse cx="32" cy="42" rx="21.5" ry="15.5" fill="#4E4E4E"/>
  <circle cx="20" cy="26" r="9.5" fill="#4E4E4E"/>
  <circle cx="44" cy="26" r="9.5" fill="#4E4E4E"/>

  <!--
    Half-lidded eyes: a full circle of white with the upper third cut away by
    the lid. The slant of that cut is what makes the frog look unimpressed,
    and it survives small sizes far better than drawn-on eyebrows would.
  -->
  <path d="M13.5 26.5a6 6 0 0 0 12 0 6 6 0 0 0-1.2-3.6l-9.8 1.9a6 6 0 0 0-1 1.7Z" fill="#FFFFFF"/>
  <path d="M38.5 26.5a6 6 0 0 0 12 0 6 6 0 0 0-1-1.7l-9.8-1.9a6 6 0 0 0-1.2 3.6Z" fill="#FFFFFF"/>

  <circle cx="21" cy="27" r="3.1" fill="#1E1E1E"/>
  <circle cx="43" cy="27" r="3.1" fill="#1E1E1E"/>

  <!-- Frown: corners low, middle high. -->
  <path d="M23 45.5q9-6 18 0" fill="none" stroke="#1E1E1E" stroke-width="3" stroke-linecap="round"/>

</svg>
